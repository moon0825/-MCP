[project]
name = "meeting-scribe"
version = "0.1.0"
description = "회의 녹음 → 화자 학습 전사 → 회의록 생성을 위한 MCP 서버"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "numpy",
    "httpx>=0.27",
    "sherpa-onnx>=1.10.30",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
gemini = ["google-genai>=1.0"]

[project.scripts]
meeting-scribe = "meeting_scribe.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_scribe"]
